name: 🏗️ Deploy Infrastructure

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.6.0"

jobs:
  terraform-validate:
    name: 🔍 Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: ⚙️ Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔧 Terraform Init
        run: terraform init

      - name: 🔍 Terraform Validate
        run: terraform validate

      - name: 📋 Terraform Format Check
        run: terraform fmt -check

  terraform-plan:
    name: 📋 Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-validate
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: ⚙️ Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔧 Terraform Init
        run: terraform init

      - name: 📋 Terraform Plan
        run: |
          terraform plan \
            -var="jwt_secret_string=${{ secrets.JWT_SECRET_STRING }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="db_host=${{ vars.DB_HOST || '' }}"

  terraform-apply:
    name: 🚀 Terraform Apply
    runs-on: ubuntu-latest
    needs: [terraform-validate, terraform-plan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: ⚙️ Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔧 Terraform Init
        run: terraform init

      - name: 🚀 Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="jwt_secret_string=${{ secrets.JWT_SECRET_STRING }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="db_host=${{ vars.DB_HOST || '' }}"

      - name: 📊 Show Outputs
        run: |
          echo "### 🎉 Infrastructure Deployment Complete!"
          echo ""
          echo "#### 📋 Resource Names (Configure in GitHub Variables)"
          echo "**EKS Cluster Name:** $(terraform output -raw eks_cluster_name)"
          echo "**ECR Repository URL:** $(terraform output -raw ecr_repository_url)"
          echo "**API Gateway URL:** $(terraform output -raw api_gateway_invoke_url)"
          echo "**Lambda Function:** $(terraform output -raw lambda_function_name)"
          echo ""
          echo "#### ⚙️ Next Steps:"
          echo "1. Set GitHub Variables in fast-food-auth-lambda repo: LAMBDA_FUNCTION_NAME"
          echo "2. Set GitHub Variables in fast-food-api repo: ECR_REPOSITORY, EKS_CLUSTER_NAME"
          echo "3. Deploy Lambda code via fast-food-auth-lambda workflow"
          echo "4. Deploy API via fast-food-api workflow"
