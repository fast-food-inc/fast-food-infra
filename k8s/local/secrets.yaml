apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
type: Opaque
stringData:
  # MongoDB
  mongo-uri: "mongodb://fast-food-mongodb:27017/fast-food-catalog"
  # Postgres
  postgres-user: "postgres"
  postgres-password: "password"
  postgres-order-db: "fast_food_production"
  postgres-payment-db: "fast_food_payment"
  # App connection strings
  order-db-url: "postgresql://postgres:password@fast-food-postgres:5432/fast_food_production?schema=public"
  payment-db-url: "postgresql://postgres:password@fast-food-postgres:5432/fast_food_payment?schema=public"
