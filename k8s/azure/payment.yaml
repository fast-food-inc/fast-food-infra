apiVersion: apps/v1
kind: Deployment
metadata:
  name: fast-food-payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fast-food-payment
  template:
    metadata:
      labels:
        app: fast-food-payment
    spec:
      containers:
        - name: payment
          image: fastfoodacrrg.azurecr.io/fast-food-payment:latest
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secrets-azure
                  key: payment-db-url
            - name: ORDER_SERVICE_URL
              value: "http://fast-food-order:3002"
            # In production, these should be real secrets
            - name: MERCADO_PAGO_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: db-secrets-azure
                  key: mp-access-token
                  optional: true
            - name: MERCADO_PAGO_NOTIFICATION_URL
              value: "https://your-public-url.com/webhooks" 
          command: ["/bin/sh", "-c"]
          args:
            - npx prisma generate && npx prisma db push --accept-data-loss && npm start
---
apiVersion: v1
kind: Service
metadata:
  name: fast-food-payment
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
  selector:
    app: fast-food-payment
