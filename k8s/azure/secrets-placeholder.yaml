# Azure environment overlays/manifests will assume secrets are populated via GitHub Actions or External Secrets.
# For this setup, we will define placeholders that expect secrets to be present in the cluster.

apiVersion: v1
kind: Secret
metadata:
  name: db-secrets-azure
type: Opaque
stringData:
  # These values will be filled by the CD pipeline or manual secret creation
  mongo-uri: "placeholder"
  order-db-url: "placeholder"
  payment-db-url: "placeholder"
